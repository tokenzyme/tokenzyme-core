name: Feature request
description: Propose a change to the API, its data model, or its tooling
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation you are hitting, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Does this change the GraphQL schema?
      description: Both clients generate their types by introspecting a running instance.
      options:
        - 'No'
        - 'Yes — adds fields or types'
        - 'Yes — changes or removes existing fields'
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Does this need a database change?
      description: Core owns only comments and signature_messages. Everything else belongs to the indexer.
      options:
        - 'No'
        - 'Yes — a table core owns'
        - 'Yes — a table the indexer owns (belongs in tokenzyme-indexer first)'
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
